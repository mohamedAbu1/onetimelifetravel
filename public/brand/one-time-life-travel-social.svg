  <path d="M180 793c120-58 225-67 360-20 135 47 240 38 360-20" fill="none" stroke="#d8ae5c" stroke-opacity=".12" stroke-width="2"/>
  <g transform="translate(290 210)" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0 245c83-124 239-176 417-91l60 35-60 36c-178-85-334-33-417 91 37-25 75-37 120-37 77 0 137 35 189 91-87 21-160 12-218-24-39-24-67-60-91-101Z" stroke-width="12"/>
    <circle cx="226" cy="246" r="22" fill="url(#gold)" stroke="none"/>
