<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">One Time Life Travel social logo</title>
  <desc id="desc">Gold Eye of Horus inspired travel emblem with One Time Life Travel lettering.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#173f49"/>
      <stop offset="1" stop-color="#071b25"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4d58b"/>
      <stop offset="0.5" stop-color="#c7953d"/>
      <stop offset="1" stop-color="#f0c96b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1080" height="1080" rx="170" fill="url(#bg)"/>
  <circle cx="540" cy="470" r="356" fill="none" stroke="#d8ae5c" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="540" cy="470" r="320" fill="none" stroke="#d8ae5c" stroke-opacity=".18" stroke-width="1" stroke-dasharray="4 18"/>
